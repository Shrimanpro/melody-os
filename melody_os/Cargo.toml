[package]
name = "melody_os"
version = "0.1.0"
edition = "2024"

[[test]]
name = "should_panic"
harness = false

[[test]]
name = "stack_overflow"
harness = false

[dependencies]
# updating bootloder from 0.9.23 to latest
# because it new nightly broke everything
bootloader = { version = "0.9.35", features = ["map_physical_memory"] }
volatile = "=0.2.6"
spin = "0.5.2"
x86_64 = "0.15.5"
uart_16550 = "0.6.0"
pic8259 = "0.11.0"
pc-keyboard = "0.7.0"
linked_list_allocator = "0.9.0"
smoltcp = { version = "0.14.0", default-features = false, features = ["alloc", "proto-ipv4", "socket-tcp", "medium-ethernet"] }

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[[bin]]
name = "melody_os"
test = true
bench = false

[package.metadata.bootimage]
test-args = [
    "-device",
    "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-serial",
    "stdio",
    "-display",
    "none",
]
test-success-exit-code = 33 # (0x10 << 1) | 1
