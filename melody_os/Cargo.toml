[package]
name = "melody_os"
version = "0.2.0"
edition = "2024"
authors = ["Melody OS Developers"]
description = "Bare-metal jukebox kernel: USB FAT32 music library, Intel HDA output, MPD over Ethernet"

[[test]]
name = "should_panic"
harness = false

[[test]]
name = "stack_overflow"
harness = false

[dependencies]
bootloader = { version = "0.9.35", features = ["map_physical_memory"] }
volatile = "0.2.6"
spin = "0.5.2"
x86_64 = "0.15.5"
uart_16550 = "0.6.0"
pic8259 = "0.11.0"
linked_list_allocator = "0.9.0"
smoltcp = { version = "0.14.0", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "proto-ipv4",
    "proto-dhcpv4",
    "socket-tcp",
    "socket-dhcpv4",
    "auto-icmp-echo-reply",
] }

# MP3 decoding (pure Rust port of minimp3, no_std).
nanomp3 = { version = "0.2.0", default-features = false }

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[[bin]]
name = "melody_os"
test = false
bench = false

[package.metadata.bootimage]
test-args = [
    "-device",
    "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-serial",
    "stdio",
    "-display",
    "none",
]
test-success-exit-code = 33 # (0x10 << 1) | 1
test-timeout = 120
